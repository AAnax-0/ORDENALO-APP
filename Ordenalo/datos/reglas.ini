# ─────────────────────────────────────────────────────────────────────────
#  Reglas de Ordénalo
#
#  Cada bloque [Nombre] es un sitio al que pueden ir las cosas.
#    tipo          asignatura → va a la carpeta de clase y se agrupa por tareas
#                  personal   → algo tuyo que no es de clase (va a «lo demás»)
#                  archivo    → se reconoce por la extensión (va a «lo demás»)
#    carpeta       nombre de la carpeta que se crea
#    palabras      si el nombre de un archivo o carpeta contiene alguna, va aquí
#    extensiones   pistas por tipo de archivo (.java → Programación…)
#    solo por tipo = si   la extensión manda aunque el nombre diga otra cosa
#    color         color con el que se ve en la aplicación
#
#  Mayúsculas y tildes dan igual: «Programación» = «programacion».
#  Puedes editarlas desde la pestaña «Reglas» o aquí mismo, a mano.
# ─────────────────────────────────────────────────────────────────────────

